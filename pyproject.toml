[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = ["E501", "UP017", "PLR0913", "PLR0915", "PLR0912", "PLR2004", "RUF012"]

[tool.ruff.isort]
known-first-party = ["backend", "config", "core", "domain", "apps", "repositories", "services"]

[tool.black]
target-version = ['py312']
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=backend --cov-report=term-missing"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
pythonpath = ["backend"]
DJANGO_SETTINGS_MODULE = "config.settings.test"
